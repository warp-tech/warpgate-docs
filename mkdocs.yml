site_name: Warpgate
site_author: Warp Technologies
site_description: Securely expose your internal services to the internet
site_url: https://warpgate.null.page

repo_name: warp-tech/warpgate
repo_url: https://github.com/warp-tech/warpgate

theme:
  name: null
  custom_dir: "theme/"

  favicon: https://github.com/warp-tech/warpgate/raw/refs/heads/main/warpgate-web/public/assets/favicon.svg

  features:
    - navigation.expand

nav:
  - Home: docs.md
  - Warpgate for Business: for-business.md
  - Getting started:
      - Native: getting-started.md
      - Docker: getting-started-on-docker.md
      - Helm: getting-started-on-helm.md
      - Kubernetes operator: getting-started-on-kubernetes.md
  - Adding targets:
      - SSH: targets/ssh.md
      - HTTP: targets/http.md
      - MySQL: targets/mysql.md
      - PostgreSQL: targets/postgres.md
      - Kubernetes: targets/kubernetes.md
      - RDP: targets/rdp.md
      - VNC: targets/vnc.md
  - Access control:
      - auth.md
      - roles.md
      - tickets.md
      - otp.md
      - sso.md
      - ldap.md
      - login-protection.md
      - recovering-access.md
  - Operations:
      - newsletter.md
      - reverse-proxy.md
      - clustering.md
      - encryption.md
      - systemd.md
      - log-forwarding.md
      - custom-ca.md
  - Advanced topics:
      - http-domain-binding.md
      - sni.md
      - chaining.md
      - protocol-support.md
  - Compare:
    - Warpgate vs. Teleport: warpgate-vs-teleport.md
    - Warpgate vs. Boundary: warpgate-vs-boundary.md
    - Warpgate vs. StrongDM: warpgate-vs-strongdm.md

plugins:
  - search
  - callouts

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      noclasses: true
      use_pygments: true
      pygments_lang_class: true
      pygments_style: github-dark
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: §
  - meta
